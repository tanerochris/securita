{% extends "base_auth.html" %}
{% block title %}Reset password — Securita{% endblock %}
{% block content %}
<h1 class="text-[24px] font-extrabold tracking-tight text-brand-navy">Reset password</h1>
<p class="mt-1 text-sm leading-relaxed text-slate-600">Enter your account email. If the account exists, we will issue a reset link that expires in 1 hour.</p>

<form class="mt-6 space-y-4" method="post" action="/reset">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div>
    <label class="auth-label" for="email">Email</label>
    <input class="auth-input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
  </div>
  <button class="btn-primary w-full !py-3" type="submit">Email reset link</button>
</form>

<p class="mt-6 border-t border-brand-mist pt-5 text-center text-sm text-slate-600">Remembered it? <a class="font-bold text-brand-primary hover:text-brand-deep" href="/login">Back to login</a></p>
{% endblock %}
