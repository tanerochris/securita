<div id="chat-widget">
  <button type="button" id="chat-launcher" aria-label="Open chat" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>
    <span class="chat-dot" aria-hidden="true"></span>
  </button>
  <div id="chat-panel" hidden>
    <div class="chat-head">
      <span class="chat-brand" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10z"/><path d="m9 11.5 2 2 4-4.5"/></svg></span>
      <span class="chat-title">Security Chat</span>
      <span class="chat-head-btns">
        <form hx-post="/chat/new" hx-target="#widget-thread" hx-swap="innerHTML" hx-on::after-request="chatShowThread(); chatResetSendButton(this)">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit" class="chat-icon-btn" data-chat-new title="New chat" aria-label="New chat"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
        <button type="button" class="chat-icon-btn" id="chat-history-btn" title="Chat history" aria-label="Chat history" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
        <button type="button" class="chat-icon-btn" id="chat-close" title="Close" aria-label="Close chat"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </span>
    </div>
    <div id="chat-history-view" hidden>
      <div class="chat-history-top">
        <button type="button" class="chat-icon-btn" id="chat-history-back" title="Back to chat" aria-label="Back to chat"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="chat-threads-head">Recent chats</span>
      </div>
      <div id="chat-history-list" hx-get="/chat/threads" hx-trigger="load-threads"></div>
    </div>
    <div id="chat-thread-view">
      <form class="chat-scope" hx-post="/chat/scope" hx-swap="none">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label class="sr-only" for="chat-scope">Repo scope</label>
        <select name="repo_id" id="chat-scope" onchange="this.form.requestSubmit()">
          <option value="" {% if not conversation.repo_id %}selected{% endif %}>All repos</option>
          {% for r in repos %}
          <option value="{{ r.id }}" {% if conversation.repo_id == r.id %}selected{% endif %}>#{{ r.id }} {{ r.name }}</option>
          {% endfor %}
        </select>
      </form>
      {% set thread_id = "widget-thread" %}
      <div id="widget-thread" role="log" aria-label="Chat messages" aria-live="polite">
        {% include "_chat_messages.html" %}
      </div>
      <div class="chat-typing" id="widget-typing" hidden aria-hidden="true"><span></span><span></span><span></span></div>
      <form class="chat-composer" hx-post="/chat/message" hx-target="#widget-thread" hx-swap="beforeend" hx-encoding="multipart/form-data" hx-on::after-request="this.reset(); chatFormSent(this);">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="thread" value="widget-thread">
        <label class="chat-icon-btn chat-attach-btn" title="Attach files" aria-label="Attach files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8L13 4.5a3.5 3.5 0 0 1 5 5L10 17.5a1.5 1.5 0 0 1-2-2L15.5 8"/></svg><input type="file" name="files" multiple hidden accept=".png,.jpg,.jpeg,.webp,.gif,.txt,.md,.log,.json,.yaml,.yml,.csv,.pdf"></label>
        <input type="text" name="text" data-chat-input placeholder="Ask… (@repo, #finding-1)" autocomplete="off" aria-label="Chat message">
        <button type="submit" class="chat-send" title="Send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>
      </form>
      <div class="chat-files" hidden></div>
    </div>
  </div>
</div>
