{% extends "base.html" %}{% block content %}<h1>Accounts</h1>
<ul>{% for u in users %}<li>{{ u.email }} — {{ u.role }}{% if u.disabled %} (disabled){% endif %}</li>{% endfor %}</ul>
<h2>Invite</h2>
<form method="post" action="/accounts/invite"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Email <input name="email" type="email" required></label>
<label>Role <select name="role"><option>owner</option><option>maintainer</option><option>developer</option><option>reporter</option></select></label>
<button type="submit">Send invite</button></form>{% endblock %}
