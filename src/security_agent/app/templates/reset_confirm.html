{% extends "base.html" %}{% block content %}<h1>Choose a new password</h1>
<form method="post" action="/reset/confirm"><input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="token" value="{{ token }}">
<label>New password <input name="password" type="password" required minlength="12"></label>
<button type="submit">Set password</button></form>{% endblock %}
