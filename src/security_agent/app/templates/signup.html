{% extends "base.html" %}{% block content %}<h1>Create account</h1>
{% if open %}<p>First signup becomes Owner.</p>{% else %}<p>Invite required.</p>{% endif %}
<form method="post" action="/signup"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Email <input name="email" type="email" required></label>
<label>Password <input name="password" type="password" required minlength="12"></label>
<label>Invite token <input name="token" value="{{ token }}"></label>
<button type="submit">Sign up</button></form>{% endblock %}
