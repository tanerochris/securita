{% extends "base.html" %}{% block content %}<h1>Log in</h1>
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Email <input name="email" type="email" required></label>
<label>Password <input name="password" type="password" required></label>
<label>MFA code (if enabled) <input name="totp"></label>
<button type="submit">Log in</button></form>
<p><a href="/reset">Forgot password?</a></p>
<p><a href="/auth/google/start">Continue with Google</a> · <a href="/auth/microsoft/start">Continue with Microsoft</a></p>{% endblock %}
