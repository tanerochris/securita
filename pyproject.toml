[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-agent"
version = "0.1.0"
description = "Self-hosted AI security agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "authlib>=1.9.1",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "fastembed",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "langchain>=1.4.7",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "packaging>=24",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyotp>=2.10.0",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
security-agent-probe = "security_agent.brain.probe:main"
security-agent-backup = "security_agent.ops.backup:backup_main"
security-agent-restore = "security_agent.ops.backup:restore_main"
security-agent-doctor = "security_agent.ops.doctor:doctor_main"
security-agent-install-tools = "security_agent.ops.install_tools:install_tools_main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/security_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# B008: FastAPI's Depends()/Form() in defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the test idiom; production code stays assert-free under S101.
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["security_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
